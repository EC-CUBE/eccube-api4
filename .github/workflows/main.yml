name: CI for Api
on:
  push:
    branches:
      - '*'
    tags:
      - '*'
    paths:
      - '**'
      - '!*.md'
  pull_request:
    paths:
      - '**'
      - '!*.md'
jobs:
  run-on-linux:
    name: Run on Linux
    runs-on:  ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        eccube_version: [ '4.4' ]
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        db: [ 'mysql', 'pgsql' ]
        plugin_code: [ 'Api44' ]
        include:
          - db: mysql
            database_url: mysql://root:password@127.0.0.1:3306/eccube_db
            database_server_version: 8
            database_charset: utf8mb4
          - db: pgsql
            database_url: postgres://postgres:password@127.0.0.1:5432/eccube_db
            database_server_version: 18
            database_charset: utf8
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ${{ matrix.dbname }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ${{ matrix.dbname }}
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mailcatcher:
        image: schickling/mailcatcher
        ports:
          - 1080:1080
          - 1025:1025
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Setup PHP
      uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
      with:
        php-version: ${{ matrix.php }}
        github-token: ''
        extensions: :xdebug, redis

    - name: Archive Plugin
      env:
        PLUGIN_CODE: ${{ matrix.plugin_code }}
      run: |
        tar cvzf ${GITHUB_WORKSPACE}/${PLUGIN_CODE}.tar.gz ./*

    - name: Setup mock-package-api
      env:
        PLUGIN_CODE: ${{ matrix.plugin_code }}
      run: |
        mkdir -p /tmp/repos
        cp ${GITHUB_WORKSPACE}/${PLUGIN_CODE}.tar.gz /tmp/repos/${PLUGIN_CODE}.tgz
        docker run --name package-api -d -v /tmp/repos:/repos -e MOCK_REPO_DIR=/repos -p 8080:8080 eccube/mock-package-api:composer2

    - name: Checkout EC-CUBE
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        repository: 'EC-CUBE/ec-cube'
        ref: ${{ matrix.eccube_version }}
        path: 'ec-cube'

    - name: Cache Composer
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5
      with:
        path: ${{ github.workspace }}/ec-cube/vendor
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install to composer
      working-directory: 'ec-cube'
      run: composer install --dev --no-interaction -o --apcu-autoloader

    - name: Setup EC-CUBE
      env:
        APP_ENV: 'test'
        APP_DEBUG: 0
        DATABASE_URL: ${{ matrix.database_url }}
        DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
        DATABASE_CHARSET: ${{ matrix.database_charset }}
        ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
        USE_SELFSIGNED_SSL_CERTIFICATE: '1'
      working-directory: 'ec-cube'
      run: |
        bin/console doctrine:database:create
        bin/console doctrine:schema:create
        bin/console eccube:fixtures:load

    - name: Setup Plugin
      env:
        APP_ENV: 'test'
        APP_DEBUG: 0
        DATABASE_URL: ${{ matrix.database_url }}
        DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
        DATABASE_CHARSET: ${{ matrix.database_charset }}
        PLUGIN_CODE: ${{ matrix.plugin_code }}
        ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
        USE_SELFSIGNED_SSL_CERTIFICATE: '1'
      working-directory: 'ec-cube'
      run: |
        bin/console doctrine:query:sql "update dtb_base_info set authentication_key='dummy'"
        bin/console eccube:composer:require ec-cube/api44
        bin/console eccube:plugin:enable --code=${PLUGIN_CODE}
        bin/console doctrine:schema:update --force --dump-sql
        bin/console cache:clear --no-warmup
        bin/console league:oauth2-server:create-client --redirect-uri=http://127.0.0.1:8000/ --grant-type=authorization_code --grant-type=client_credentials --grant-type=implicit --grant-type=password --grant-type=refresh_token --scope=read --scope=write test
        rm codeception/_support/*Tester.php
        chmod 600 app/PluginData/Api44/oauth/private.key

    - name: Run PHPStan
      env:
        APP_ENV: 'test'
        APP_DEBUG: 0
        DATABASE_URL: ${{ matrix.database_url }}
        DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
        DATABASE_CHARSET: ${{ matrix.database_charset }}
        PLUGIN_CODE: ${{ matrix.plugin_code }}
        ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
        USE_SELFSIGNED_SSL_CERTIFICATE: '1'
      working-directory: 'ec-cube'
      run: |
        bin/console cache:clear --no-warmup
        ./vendor/bin/phpstan analyse -c app/Plugin/${PLUGIN_CODE}/phpstan.neon.dist --no-progress

    - name: Run PHPUnit
      env:
        APP_ENV: 'test'
        APP_DEBUG: 0
        DATABASE_URL: ${{ matrix.database_url }}
        DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
        DATABASE_CHARSET: ${{ matrix.database_charset }}
        PLUGIN_CODE: ${{ matrix.plugin_code }}
        ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
        USE_SELFSIGNED_SSL_CERTIFICATE: '1'
      working-directory: 'ec-cube'
      run: |
        bin/console cache:clear --no-warmup
        ./vendor/bin/phpunit -c app/Plugin/${PLUGIN_CODE}/phpunit.xml.dist app/Plugin/${PLUGIN_CODE}/Tests


    - name: Disable Plugin
      working-directory: 'ec-cube'
      env:
        APP_ENV: 'test'
        APP_DEBUG: 0
        DATABASE_URL: ${{ matrix.database_url }}
        DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
        DATABASE_CHARSET: ${{ matrix.database_charset }}
        PLUGIN_CODE: ${{ matrix.plugin_code }}
        ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
        USE_SELFSIGNED_SSL_CERTIFICATE: '1'
      run: bin/console eccube:plugin:disable --code=${PLUGIN_CODE}

    - name: Uninstall Plugin
      env:
        APP_ENV: 'test'
        APP_DEBUG: 0
        DATABASE_URL: ${{ matrix.database_url }}
        DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
        DATABASE_CHARSET: ${{ matrix.database_charset }}
        PLUGIN_CODE: ${{ matrix.plugin_code }}
        ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
        USE_SELFSIGNED_SSL_CERTIFICATE: '1'
      working-directory: 'ec-cube'
      run: bin/console eccube:plugin:uninstall --code=${PLUGIN_CODE}
